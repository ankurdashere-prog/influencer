name: daily-influencer-post

on:
  schedule:
    - cron: "30 4 * * *"      # roz 10:00 AM IST
  workflow_dispatch:           # Actions tab se manually bhi chala sakte ho

permissions:
  contents: write              # state/history.json commit karne ke liye

concurrency:
  group: influencer
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Make and post today's content
        run: python -m influencer auto --post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ vars.SUPABASE_BUCKET }}

      - name: Save outputs (ads approval ke liye yahin se download karo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
          retention-days: 7

      - name: Commit history
        if: always()
        run: |
          git config user.name "influencer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/history.json || true
          git diff --cached --quiet || (git commit -m "chore: update post history" && git push)
