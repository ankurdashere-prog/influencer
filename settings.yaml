# Haftawar plan (IST). Values: reel | photo | ad
# ad = brands/ folder ke active brief ko baari-baari se use karta hai, par kabhi auto-post nahi hota
# (client approval ke liye output/ mein rendered video rehta hai).
weekly_plan:
  mon: reel
  tue: photo
  wed: reel
  thu: photo
  fri: reel
  sat: reel
  sun: photo

video:
  width: 1080
  height: 1920
  fps: 30
  scenes: 5                 # ek reel mein kitni images (cost control: kam = sasta)
  voice_words: 48           # lagbhag 18-20 second ka voiceover
  tail_seconds: 0.6
  talking_seconds: 8        # shuru ke itne second chehra bolega (lip-sync). Kam = sasta. Env: TALKING_PROVIDER=fal chahiye
  music_volume: 0.12
  clip_trim_head: 0.15
  clip_trim_tail: 0.2
  punch_zoom: 1.08        # 1.0 = zoom band
  normalize_audio: true
  caption:
    font: Arial
    size: 84
    margin_bottom: 460
    words_per_group: 3
    highlight: yellow        # current bola ja raha word

ideas:
  history_to_avoid: 30       # pichhle kitne topics repeat nahi karne
